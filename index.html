<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5b08a" />
  <title>Download App — Anytime Online</title>
  <style>
    :root {
      --bg: #f5b08a;
      --teal: #16aaa5;
      --green: #48c653;
      --gold: #e8a900;
      --text: #050505;
      --card: rgba(255,255,255,.20);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 18px 50px;
    }

    .container {
      width: min(680px, 100%);
      text-align: center;
    }

    .hero {
      width: min(520px, 92%);
      margin: 0 auto 18px;
      display: block;
      mix-blend-mode: multiply;
    }

    .download-link {
      display: inline-block;
      color: #000;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 5px;
      margin: 10px 0 28px;
    }

    .actions {
      display: grid;
      gap: 18px;
      width: min(560px, 100%);
      margin: 0 auto;
    }

    .btn {
      border: 0;
      border-radius: 22px;
      min-height: 86px;
      padding: 18px 24px;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,.08);
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .btn:active { transform: translateY(1px); }

    .call { background: var(--teal); }
    .whatsapp { background: var(--green); }

    .headline {
      margin: 38px auto 42px;
      max-width: 600px;
      font-size: clamp(42px, 8vw, 68px);
      line-height: 1.08;
      letter-spacing: -1.5px;
      font-weight: 900;
    }

    .download-wrap {
      width: min(570px, 100%);
      margin: 0 auto;
      padding: 24px;
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 0 0 2px rgba(255,255,255,.16) inset;
    }

    .download {
      width: 100%;
      min-height: 112px;
      border: 0;
      border-radius: 25px;
      background: var(--gold);
      color: white;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.08);
      transition: transform .15s ease, filter .15s ease;
    }

    .download:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .note {
      margin-top: 16px;
      font-size: 14px;
      opacity: .72;
    }

    @media (max-width: 520px) {
      .page { padding-top: 18px; }
      .hero { width: 100%; }
      .download-link { margin-bottom: 20px; }
      .btn { min-height: 74px; border-radius: 18px; }
      .headline { margin: 30px auto 32px; }
      .download-wrap { padding: 14px; border-radius: 22px; }
      .download { min-height: 88px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="container" aria-label="Download app landing page">
      <img class="hero" src="hero.jpg" alt="Happy woman with raised hands" />

      <a class="download-link" href="#download">+ Download</a>

      <div class="actions">
        <button class="btn call" onclick="callNow()">📞 Call Now</button>
        <button class="btn whatsapp" onclick="openWhatsApp()">💬 WhatsApp</button>
      </div>

      <h1 class="headline">Download NO.1<br>Online<br>Anytime</h1>

      <div class="download-wrap" id="download">
        <button class="download" onclick="downloadApp()">↓ DOWNLOAD APP NOW</button>
        <div class="note">Replace the button actions with your real app/contact links.</div>
      </div>
    </section>
  </main>

  <script>
    // Replace these placeholder values with your real links/numbers.
    const PHONE = "tel:+910000000000";
    const WHATSAPP = "https://wa.me/910000000000";
    const APP_DOWNLOAD = "#";

    function callNow() {
      window.location.href = PHONE;
    }

    function openWhatsApp() {
      window.open(WHATSAPP, "_blank", "noopener,noreferrer");
    }

    function downloadApp() {
      if (APP_DOWNLOAD === "#") {
        alert("Add your real app download URL in the APP_DOWNLOAD variable.");
        return;
      }
      window.location.href = APP_DOWNLOAD;
    }
  </script>
</body>
</html>
